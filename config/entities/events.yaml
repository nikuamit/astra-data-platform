entity: events

dedup_keys:
  - event_id

dedup_order_col: kafka_ts

dq_rules:
  - name: event_id_not_null
    type: not_null
    column: event_id

  - name: user_id_not_null
    type: not_null
    column: user_id

  - name: event_type_accepted
    type: accepted_values
    column: event_type
    params:
      values: [page_view, click, purchase, signup, logout]

  - name: amount_range
    type: range
    column: amount
    params:
      min: 0
      max: 1000000
